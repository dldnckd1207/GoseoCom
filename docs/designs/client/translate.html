<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>번역하기 - 해독 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 네비게이션 바 -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 -->
                <a href="index.html" class="flex items-center gap-2 text-xl font-semibold text-gray-900 hover:text-blue-600 transition-colors">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span>해독 AI</span>
                </a>

                <!-- 네비게이션 메뉴 -->
                <div class="flex items-center gap-1 sm:gap-2">
                    <a href="translate.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium bg-blue-600 text-white transition-colors">
                        번역하기
                    </a>
                    <a href="community.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors">
                        커뮤니티
                    </a>
                    <a href="library.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors">
                        라이브러리
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <div class="min-h-screen bg-gray-50 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- 페이지 헤더 -->
            <div class="mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-2">고서 번역</h1>
                <p class="text-gray-600">
                    AI 기반 자동 번역으로 고서를 현대 한국어로 변환하세요
                </p>
            </div>

            <!-- 파일 업로드 -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">이미지 업로드</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-600 transition-colors cursor-pointer">
                    <input type="file" id="file-upload" class="hidden" accept="image/*">
                    <label for="file-upload" class="cursor-pointer flex flex-col items-center">
                        <svg class="w-12 h-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-gray-700 font-medium mb-1">
                            클릭하여 파일을 업로드하세요
                        </p>
                        <p class="text-sm text-gray-500">
                            PNG, JPG, PDF 파일을 지원합니다
                        </p>
                    </label>
                </div>
            </div>

            <!-- 번역 영역 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 원본 텍스트 -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="border-b border-gray-200 px-6 py-4 bg-gray-50">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <h2 class="text-lg font-semibold text-gray-900">원본 텍스트</h2>
                        </div>
                    </div>
                    <div class="p-6">
                        <textarea placeholder="고서 원본 텍스트를 입력하거나 이미지를 업로드하세요..." class="w-full h-96 px-4 py-3 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"></textarea>
                        <div class="mt-4">
                            <button class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                </svg>
                                <span>AI 번역 시작</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 번역된 텍스트 -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="border-b border-gray-200 px-6 py-4 bg-gray-50">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                </svg>
                                <h2 class="text-lg font-semibold text-gray-900">번역 결과</h2>
                            </div>
                            <button class="text-blue-600 hover:text-blue-700 flex items-center gap-1 text-sm font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                <span>다운로드</span>
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="w-full h-96 px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 overflow-y-auto">
                            <p class="text-gray-400 text-center mt-32">
                                번역 결과가 여기에 표시됩니다
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 안내 사항 -->
            <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-6">
                <h3 class="text-lg font-semibold text-blue-900 mb-3">사용 안내</h3>
                <ul class="space-y-2 text-blue-800">
                    <li class="flex items-start gap-2">
                        <span class="text-blue-600 mt-1">•</span>
                        <span>고서 이미지를 업로드하면 AI가 자동으로 텍스트를 인식합니다</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <span class="text-blue-600 mt-1">•</span>
                        <span>직접 텍스트를 입력하여 번역할 수도 있습니다</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <span class="text-blue-600 mt-1">•</span>
                        <span>번역 결과는 다운로드하거나 커뮤니티에 공유할 수 있습니다</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
