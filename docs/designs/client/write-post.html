<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성하기 - 해독 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 네비게이션 바 -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 -->
                <a href="index.html" class="flex items-center gap-2 text-xl font-semibold text-gray-900 hover:text-blue-600 transition-colors">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span>해독 AI</span>
                </a>

                <!-- 네비게이션 메뉴 -->
                <div class="flex items-center gap-1 sm:gap-2">
                    <a href="translate.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors">
                        번역하기
                    </a>
                    <a href="community.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium bg-blue-600 text-white transition-colors">
                        커뮤니티
                    </a>
                    <a href="library.html" class="px-3 sm:px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors">
                        라이브러리
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <div class="min-h-screen bg-gray-50 py-8">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- 뒤로가기 -->
            <a href="community.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-6 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>목록으로</span>
            </a>

            <!-- 글 작성 폼 -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="border-b border-gray-200 px-6 py-4 bg-gray-50">
                    <h1 class="text-2xl font-bold text-gray-900">글 작성하기</h1>
                </div>

                <form class="p-6">
                    <!-- 카테고리 선택 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <!-- 글 유형 선택 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                글 유형
                            </label>
                            <div class="flex flex-wrap gap-2">
                                <button type="button" class="px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
                                    번역
                                </button>
                                <button type="button" class="px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
                                    질문
                                </button>
                                <button type="button" class="px-4 py-2 rounded-lg font-medium bg-blue-600 text-white transition-colors">
                                    자유
                                </button>
                            </div>
                        </div>

                        <!-- 시대 선택 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                시대
                            </label>
                            <select class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
                                <option>선사</option>
                                <option>삼국</option>
                                <option>고려</option>
                                <option selected>조선</option>
                            </select>
                        </div>
                    </div>

                    <!-- 제목 입력 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            제목
                        </label>
                        <input type="text" placeholder="제목을 입력하세요" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" required>
                    </div>

                    <!-- 내용 입력 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            내용
                        </label>
                        <textarea placeholder="내용을 입력하세요" class="w-full px-4 py-3 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" rows="12" required></textarea>
                    </div>

                    <!-- 버튼 -->
                    <div class="flex gap-3 justify-end">
                        <a href="community.html" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
                            취소
                        </a>
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors">
                            작성 완료
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
