upstream fastapi {
    server server:8000;
}

upstream remix_client {
    server client:3000;
}

upstream remix_admin {
    server admin:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # FastAPI — OAuth(Google/Kakao) + Token 갱신
    # /auth/logout 등 나머지는 클라이언트(React Router action)가 처리
    location ~ ^/auth/(google|kakao|refresh) {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI — REST API
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI — Swagger / ReDoc (개발 환경)
    location /docs {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    # 파일 서빙 — FastAPI 경유 (인증 체크 + 파일 응답)
    location /files/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 관리자 페이지
    location /admin/ {
        proxy_pass http://remix_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 사용자 페이지 (기본)
    location / {
        proxy_pass http://remix_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
