[project]
name = "haedok-server"
version = "0.1.0"
description = "Haedok AI — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.95.0",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "authlib>=1.6.10",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.3",
    "google-cloud-vision>=3.13.0",
    "google-genai>=2.2.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "python-slugify>=8.0.4",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import 정렬)
    "N",      # pep8-naming
    "UP",     # pyupgrade (최신 문법 권장)
    "B",      # flake8-bugbear (버그 패턴 감지)
    "SIM",    # flake8-simplify (단순화 제안)
    "RUF",    # Ruff 전용 규칙
]
ignore = [
    "E501",   # 줄 길이 (formatter가 처리)
    "B008",   # FastAPI Depends() / require_level() in argument defaults (의도적 패턴)
    "UP042",  # (str, Enum) → StrEnum (별도 리팩토링 대상, 지금 당장 변경 불필요)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["google.api_core.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
